name: 주간 공고 갱신
on:
  schedule:
    - cron: "0 22 * * 0"   # 매주 월요일 07:00 KST (UTC 일요일 22:00)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: 사이트 생성
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: python build_site.py
      - name: 변경사항 저장
        run: |
          git config user.name "gongo-bot"
          git config user.email "gongo-bot@users.noreply.github.com"
          git add docs state_seen.json output || true
          git commit -m "주간 갱신 $(date +%F)" || echo "변경 없음"
          git push
