name: 공고 자동 갱신
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (UTC 전날 22:00). 주간 브리핑은 월요일에만 생성
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: 사이트 생성
        env:
          TZ: Asia/Seoul            # 날짜 계산을 한국 시간으로
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}   # 선택: 없으면 기업마당만
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}       # 선택: 생활 지원금(정부24 공공서비스). 없으면 건너뜀
        run: python build_site.py
      - name: 변경사항 저장
        run: |
          git config user.name "gongo-bot"
          git config user.email "gongo-bot@users.noreply.github.com"
          git add docs state_seen.json output || true
          git commit -m "공고 갱신 $(date +%F)" || echo "변경 없음"
          git push
